[package]
name = "kimbap"
version = "0.1.0"
edition = "2024"
description = "A format-independent Nautilus preview service"
publish = false

[dependencies]
gio = "0.22"
glib = "0.22"
glib-unix = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
gdk4-wayland = "0.11"
async-channel = "2"
libc = "0.2"
libmpv2-sys = { version = "4", optional = true }
kimbap-worker = { path = "crates/worker" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace]
members = ["crates/worker", "crates/jpeg-worker", "crates/pdf-worker"]
default-members = [".", "crates/jpeg-worker", "crates/pdf-worker"]
resolver = "3"

[features]
video = ["dep:libmpv2-sys"]

[[example]]
name = "video-probe"
required-features = ["video"]
